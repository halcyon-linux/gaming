# ci/packages.toml — the gaming build registry + sweep-feed config.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# batch 0  every package — nothing here BuildRequires another registry
#          entry, so the whole registry builds in one (long) wave.
# The optional [pkg.updates] table drives the daily sweep (update.yml):
#   feed = "custom"          feeds.custom.custom_<name>() — the ported logic
# Packages without an [pkg.updates] table are never swept.

# -------------------------------------------------------- mesa (Intel + AMD)

# mesa-git: main-branch snapshot of mesa/mesa (gitlab.freedesktop.org, the
# canonical repo), built as a drop-in replacement for Fedora's mesa — the
# binary packages keep the mesa-* names, so the repo's priority=1 makes them
# shadow Fedora's mesa once enabled. Version goes
# <base>^<bumpver>.git<shortcommit>; see custom_mesa_git in ci/sweep/custom.py.
[mesa-git]
batch = 0

[mesa-git.updates]
feed = "custom"
custom = "mesa-git"

# ------------------------------------------------ protonplus (compat tools)

# protonplus: Vala/GTK4 compatibility tools manager. Follows GitHub
# *releases* (not tags) — upstream's main branch already carries the next
# version, so a tag feed would bump ahead of the release.
[protonplus]
batch = 0

[protonplus.updates]
feed = "github-release"
repo = "Vysp3r/ProtonPlus"
